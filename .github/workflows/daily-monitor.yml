name: Daily 12U tournament monitor

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

concurrency:
  group: tournament-monitor
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - id: collect
        continue-on-error: true
        run: npm run collect
      - run: npm run test:unit
      - run: npm run export:pages
      - run: npm run test:site
      - name: Save public state and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/history
          git diff --cached --quiet || git commit -m "Update tournament monitor data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Upload collection diagnostics
        if: steps.collect.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: collection-diagnostics-${{ github.run_id }}
          path: .artifacts
          retention-days: 7
          if-no-files-found: ignore
